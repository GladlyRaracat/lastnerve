<head>

<title>Opening the referral resource sign-up · Last Nerve</title>
<!-- Click counter. Each load of this page shows up in Cloudflare Web Analytics under Paths as /go/provider.html,
     which is how we count taps on this button. It then forwards to the form. Change the form link in DEST below. -->
<noscript><meta http-equiv="refresh" content="0;url=https://docs.google.com/forms/d/1hu-YQej-dc0OMCqkd5dJmXOi6q_WRswy4bybCPPXHzk/viewform"></noscript>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf8ff;color:#1e1a3a;font-family:ui-sans-serif,system-ui,sans-serif;text-align:center;padding:24px}

a{color:#d6286f;font-weight:700}
</style>
</head>
<body>
<main>
  <p>Opening the referral resource sign-up…</p>
  <a id="go" href="https://docs.google.com/forms/d/1hu-YQej-dc0OMCqkd5dJmXOi6q_WRswy4bybCPPXHzk/viewform">Open the sign-up form</a>
</main>
<script>
const DEST = "https://docs.google.com/forms/d/1hu-YQej-dc0OMCqkd5dJmXOi6q_WRswy4bybCPPXHzk/viewform";
(function(){
  let gone = false;
  function go(){ if(gone) return; gone = true; location.replace(DEST); }
  // Give the analytics beacon a moment to record the page view, then forward.
  window.addEventListener("load", function(){ setTimeout(go, 900); });
  setTimeout(go, 3000);   // safety net if the load event is slow
})();
</script>
